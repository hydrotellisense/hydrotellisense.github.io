<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>River Flow Visualizer</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
html,body,#map{margin:0;width:100%;height:100%;font-family:system-ui,sans-serif}#panel{position:absolute;z-index:2;top:16px;left:16px;background:#101d2de8;color:#fff;padding:16px;border-radius:12px;width:280px;box-shadow:0 5px 25px #0005}h2{margin:0 0 12px;font-size:18px}label{display:block;margin:10px 0 4px;font-size:13px}input[type=range]{width:100%}button{background:#1e9cce;color:white;border:0;padding:9px 12px;border-radius:6px;cursor:pointer}small{color:#bcd0de}#status{margin-top:10px;font-size:12px;line-height:1.5}#info{margin-top:8px;font-size:12px;white-space:pre-wrap}input[type=file]{max-width:100%;font-size:12px}
</style></head>
<body><div id="map"></div><div id="panel"><h2>🌊 River flow</h2><small>Animated downstream movement • 5,000+ reaches</small><label>Load GeoJSON</label><input id="file" type="file" accept=".geojson,.json,application/json"><label>Flow speed <span id="speedValue">1.0×</span></label><input id="speed" type="range" min="0" max="4" value="1" step="0.1"><label>Width exaggeration <span id="widthValue">1.0×</span></label><input id="width" type="range" min="0.2" max="8" value="1" step="0.2"><label>Particle density <span id="densityValue">1.0×</span></label><input id="density" type="range" min="0.2" max="3" value="1" step="0.2"><p><button id="toggle">Pause</button></p><div id="status">Loading rivers.geojson…</div><div id="info"></div></div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
'use strict';
// Each particle follows a reach polyline; elevation direction must be correct in source data.
// A single WebGL layer draws all particles in one GPU draw call.
const map=new maplibregl.Map({container:'map',style:'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',center:[0,20],zoom:2,antialias:true});
map.addControl(new maplibregl.NavigationControl(),'bottom-right');
const $=id=>document.getElementById(id);
let reaches=[],particles=[],running=true,lastTime=0,flowSpeed=1,widthMultiplier=1,density=1,customLayer=null;
const EARTH=6378137,DEG=Math.PI/180;
function project(lon,lat){const c=Math.max(-85.051129,Math.min(85.051129,lat));return [(lon+180)/360,(1-Math.log(Math.tan(Math.PI/4+c*DEG/2))/Math.PI)/2]}
function haversine(a,b){const dlat=(b[1]-a[1])*DEG,dlon=(b[0]-a[0])*DEG,p1=a[1]*DEG,p2=b[1]*DEG;const x=Math.sin(dlat/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dlon/2)**2;return 2*EARTH*Math.asin(Math.min(1,Math.sqrt(x)))}
function value(p,keys,fallback){for(const k of keys){const v=Number(p[k]);if(p[k]!==null&&p[k]!==undefined&&p[k]!==''&&Number.isFinite(v))return v}return fallback}
function parse(data){if(data.type!=='FeatureCollection'||!Array.isArray(data.features))throw Error('Expected GeoJSON FeatureCollection');const out=[];for(const f of data.features){if(!f.geometry)continue;const paths=f.geometry.type==='LineString'?[f.geometry.coordinates]:f.geometry.type==='MultiLineString'?f.geometry.coordinates:[];for(const path of paths){if(!Array.isArray(path)||path.length<2)continue;const coords=path.filter(p=>Array.isArray(p)&&Number.isFinite(p[0])&&Number.isFinite(p[1]));if(coords.length<2)continue;const cum=[0];for(let i=1;i<coords.length;i++)cum.push(cum.at(-1)+haversine(coords[i-1],coords[i]));const length=cum.at(-1);if(length<0.1)continue;const p=f.properties||{};out.push({id:p.reach_id??p.id??out.length,coords,merc:coords.map(c=>project(c[0],c[1])),cum,length,slope:Math.max(0,value(p,['slope','Slope','SLOPE'],0.0001)),width:Math.max(1,value(p,['width','Width','WIDTH'],30)),height:value(p,['height','Height','elevation','Elevation'],NaN)});}}return out}
function sample(r,d){let lo=0,hi=r.cum.length-1;while(lo+1<hi){const mid=(lo+hi)>>1;if(r.cum[mid]<=d)lo=mid;else hi=mid}const segment=r.cum[hi]-r.cum[lo],t=segment>0?(d-r.cum[lo])/segment:0;return [r.merc[lo][0]+(r.merc[hi][0]-r.merc[lo][0])*t,r.merc[lo][1]+(r.merc[hi][1]-r.merc[lo][1])*t]}
// Speed is a visual proxy proportional to sqrt(slope); not calibrated physical velocity.
function velocity(r){return Math.min(18,Math.max(0.15,2.5*Math.sqrt(r.slope/0.001)))}
function createParticles(){particles=[];const max=80000;const target=Math.max(1,reaches.reduce((sum,r)=>sum+Math.min(100,Math.max(1,Math.round(r.length/700)))*density,0));const scale=Math.min(1,max/target);for(let j=0;j<reaches.length;j++){const r=reaches[j],n=Math.max(1,Math.round(Math.min(100,Math.max(1,r.length/700))*density*scale));for(let i=0;i<n;i++)particles.push({r:j,d:(i+Math.random()*0.4)/n*r.length})}if(customLayer)customLayer.count=particles.length}
function fit(recs){const b=new maplibregl.LngLatBounds();for(const r of recs)for(const c of r.coords)b.extend(c);if(!b.isEmpty())map.fitBounds(b,{padding:60,maxZoom:11,duration:800})}
function load(data){reaches=parse(data);if(!reaches.length)throw Error('No valid LineString reaches');createParticles();const fc={type:'FeatureCollection',features:reaches.map(r=>({type:'Feature',properties:{id:String(r.id),width:r.width,slope:r.slope,height:r.height},geometry:{type:'LineString',coordinates:r.coords}}))};if(map.getSource('rivers'))map.getSource('rivers').setData(fc);else{map.addSource('rivers',{type:'geojson',data:fc});map.addLayer({id:'river-base',type:'line',source:'rivers',paint:{'line-color':'#116ca0','line-opacity':0.8,'line-width':['interpolate',['linear'],['zoom'],3,['max',0.8,['*',0.003,['get','width']]],12,['max',2,['*',0.08,['get','width']]]]}});map.addLayer({id:'river-core',type:'line',source:'rivers',paint:{'line-color':'#2aa9d8','line-opacity':0.42,'line-width':['interpolate',['linear'],['zoom'],3,0.7,12,2.2]}})}fit(reaches);$('status').textContent=`${reaches.length.toLocaleString()} reaches • ${particles.length.toLocaleString()} moving particles`;}
function shader(gl,type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
customLayer={id:'flow-particles',type:'custom',renderingMode:'2d',count:0,onAdd(map,gl){const vs=`precision highp float;attribute vec2 a_pos;attribute float a_size;uniform mat4 u_matrix;uniform float u_zoom;varying float v_alpha;void main(){gl_Position=u_matrix*vec4(a_pos,0.0,1.0);gl_PointSize=clamp(a_size*u_zoom,2.0,18.0);v_alpha=0.92;}`;const fs=`precision mediump float;varying float v_alpha;void main(){vec2 d=gl_PointCoord-vec2(0.5);float rr=length(d);float a=1.0-smoothstep(0.12,0.5,rr);gl_FragColor=vec4(0.55,0.91,1.0,a*v_alpha);}`;const prog=gl.createProgram();gl.attachShader(prog,shader(gl,gl.VERTEX_SHADER,vs));gl.attachShader(prog,shader(gl,gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(prog));this.prog=prog;this.pos=gl.getAttribLocation(prog,'a_pos');this.size=gl.getAttribLocation(prog,'a_size');this.matrix=gl.getUniformLocation(prog,'u_matrix');this.zoom=gl.getUniformLocation(prog,'u_zoom');this.buf=gl.createBuffer();this.array=new Float32Array(0)},render(gl,args){if(!reaches.length||!particles.length)return;const now=performance.now(),dt=lastTime?Math.min(0.1,(now-lastTime)/1000):0;lastTime=now;if(running)for(const p of particles){const r=reaches[p.r];p.d=(p.d+dt*velocity(r)*flowSpeed*150)%r.length}const count=particles.length;if(this.array.length<count*3)this.array=new Float32Array(count*3);for(let i=0;i<count;i++){const p=particles[i],r=reaches[p.r],xy=sample(r,p.d),k=i*3;this.array[k]=xy[0];this.array[k+1]=xy[1];this.array[k+2]=Math.max(2,Math.min(12,2+Math.sqrt(r.width)*0.35*widthMultiplier))}gl.useProgram(this.prog);gl.bindBuffer(gl.ARRAY_BUFFER,this.buf);gl.bufferData(gl.ARRAY_BUFFER,this.array.subarray(0,count*3),gl.DYNAMIC_DRAW);gl.enableVertexAttribArray(this.pos);gl.vertexAttribPointer(this.pos,2,gl.FLOAT,false,12,0);gl.enableVertexAttribArray(this.size);gl.vertexAttribPointer(this.size,1,gl.FLOAT,false,12,8);gl.uniformMatrix4fv(this.matrix,false,(args.defaultProjectionData?.mainMatrix || args));gl.uniform1f(this.zoom,Math.max(0.5,Math.min(2.5,map.getZoom()/7)));gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.drawArrays(gl.POINTS,0,count);map.triggerRepaint()},onRemove(map,gl){gl.deleteBuffer(this.buf);gl.deleteProgram(this.prog)}};
map.on('load',async()=>{map.addLayer(customLayer);try{const res=await fetch('./rivers.geojson');if(!res.ok)throw Error('No rivers.geojson found. Choose a file above.');load(await res.json())}catch(e){$('status').textContent=e.message}});
$('file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{load(JSON.parse(await f.text()))}catch(err){$('status').textContent='Error: '+err.message}});
$('speed').addEventListener('input',e=>{flowSpeed=+e.target.value;$('speedValue').textContent=flowSpeed.toFixed(1)+'×'});
$('width').addEventListener('input',e=>{widthMultiplier=+e.target.value;$('widthValue').textContent=widthMultiplier.toFixed(1)+'×';if(map.getLayer('river-base'))map.setPaintProperty('river-base','line-width',['interpolate',['linear'],['zoom'],3,['max',0.8,['*',0.003*widthMultiplier,['get','width']]],12,['max',2,['*',0.08*widthMultiplier,['get','width']]]])});
$('density').addEventListener('input',e=>{density=+e.target.value;$('densityValue').textContent=density.toFixed(1)+'×';createParticles()});
$('toggle').addEventListener('click',()=>{running=!running;$('toggle').textContent=running?'Pause':'Play'});
map.on('click','river-base',e=>{const p=e.features?.[0]?.properties;if(!p)return;$('info').textContent=`Reach: ${p.id}\nElevation: ${Number(p.height).toFixed(2)} m\nWidth: ${Number(p.width).toFixed(1)} m\nSlope: ${Number(p.slope).toFixed(6)}`});
</script></body></html>
